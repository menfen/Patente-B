# Publishes the web app (src/PatenteB.Web/wwwroot) to GitHub Pages, including privacy.html,
# licenses.html and security.html for the store listings.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: Publish web app

on:
  push:
    branches: [main]
    paths: ['src/PatenteB.Web/wwwroot/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/PatenteB.Web/wwwroot
      - id: deployment
        uses: actions/deploy-pages@v4
